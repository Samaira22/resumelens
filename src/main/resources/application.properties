spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.datasource.url=jdbc:h2:file:./data/resumelens
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT. The default below is for local development only.
# In any real deployment set the JWT_SECRET environment variable.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt.expiration-minutes=120